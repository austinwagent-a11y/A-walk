services:
  - type: web
    name: austin-walker-real-estate
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SITE_URL
        fromValue: https://austin-walker-real-estate.onrender.com
      - key: HUBSPOT_ACCESS_TOKEN
        sync: false
